version: "3.9"

services:

  fastapi:
    build: .
    container_name: fastapi_app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  redis:
    image: redis:7
    container_name: redis_container

    ports:
      - "6379:6379"