name: AI Career Intelligence CI

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7

        ports:
          - 6379:6379
        
        options: >-
         --health-cmd "redis-cliping"
         --health-interval 10s
         --health-timeout 5s
         --health-retries 5
    
    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python
      uses: actions/checkout@v5

      with:
        python-version: "3.11"
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip

        pip install -r requirements.txt
    
    - name: Run Linter
      run: |
        flake8 app

    - name: Run Tests
      env:
        REDIS_HOST: localhost
      run: |
        pytest

      
      